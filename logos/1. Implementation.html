<style>
svg.ns7{--bsec:rgba(20,20,19,.35);--tpri:#1a1a18;--ttert:#73726c;--nf:#EEEDFE;--ns:#534AB7;--af:#1D9E75;--as:#0F6E56;--cf:#E1F5EE;--cs:#0F6E56;--ct:#085041;--md:#1D9E75}
svg.ns7 .tts{font:500 12px var(--font-sans,system-ui,sans-serif);fill:var(--color-text-primary,var(--tpri))}

svg.ns7 .dot{opacity:0}
svg.ns7 .core{fill:var(--cf);stroke:var(--cs);stroke-width:1}
svg.ns7 .ring{fill:none;stroke:var(--color-border-secondary,var(--bsec));stroke-width:0.75;stroke-dasharray:3 4}
svg.ns7 .mdot{fill:var(--md)}
svg.ns7 .pulse{fill:none;stroke:var(--cs);stroke-width:1;opacity:0;transform-box:fill-box;transform-origin:center}
svg.ns7 .orb1,svg.ns7 .orb2{transform-origin:340px 305px}
@media(prefers-color-scheme:dark){

}
svg.ns7 .prog{animation:ns7p 6s linear infinite}
svg.ns7 .dot{animation:ns7d 6s linear infinite}
svg.ns7 .n0{animation:ns7n0 6s linear infinite}svg.ns7 .n1{animation:ns7n1 6s linear infinite}

svg.ns7 .n4{animation:ns7n4 6s linear infinite}svg.ns7 .n5{animation:ns7n5 6s linear infinite}
svg.ns7 .n6{animation:ns7n6 6s linear infinite}
svg.ns7 .orb1{animation:ns7r1 18s linear infinite}
svg.ns7 .orb2{animation:ns7r2 11s linear infinite}
svg.ns7 .pulse{animation:ns7pl 2.4s ease-out infinite}
@keyframes ns7p{0%{transform:scaleX(0);opacity:1}92%{transform:scaleX(1);opacity:1}96%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
@keyframes ns7d{0%{transform:translateX(0);opacity:1}92%{transform:translateX(530px);opacity:1}96%{transform:translateX(530px);opacity:1}100%{transform:translateX(530px);opacity:0}}
@keyframes ns7n0{0%{opacity:0}2%{opacity:0}5%{opacity:1}95%{opacity:1}100%{opacity:0}}
@keyframes ns7n1{0%{opacity:0}15%{opacity:0}18%{opacity:1}95%{opacity:1}100%{opacity:0}}
@keyframes ns7n2{0%{opacity:0}31%{opacity:0}34%{opacity:1}95%{opacity:1}100%{opacity:0}}
@keyframes ns7n3{0%{opacity:0}46%{opacity:0}49%{opacity:1}95%{opacity:1}100%{opacity:0}}
@keyframes ns7n4{0%{opacity:0}61%{opacity:0}64%{opacity:1}95%{opacity:1}100%{opacity:0}}
@keyframes ns7n5{0%{opacity:0}77%{opacity:0}80%{opacity:1}95%{opacity:1}100%{opacity:0}}
@keyframes ns7n6{0%{opacity:0}92%{opacity:0}95%{opacity:1}97%{opacity:1}100%{opacity:0}}
@keyframes ns7r1{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes ns7r2{from{transform:rotate(0deg)}to{transform:rotate(-360deg)}}
@keyframes ns7pl{0%{transform:scale(1);opacity:.55}70%{transform:scale(1.45);opacity:0}100%{transform:scale(1.45);opacity:0}}
